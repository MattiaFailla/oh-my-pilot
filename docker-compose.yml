services:
  oh-my-pilot:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    image: oh-my-pilot:${VERSION:-dev}
    ports:
      - "9090:9090"
    volumes:
      # Persistent SQLite data — required across restarts
      - oh-my-pilot-data:/home/pilot/.oh-my-pilot/data
      # Mount your config file (copy configs/oh-my-pilot.example.yaml → config.yaml)
      - ./config.yaml:/home/pilot/.oh-my-pilot/config.yaml:ro
      # OMP owns provider credentials and profile configuration.
      - ./omp-profile:/home/pilot/.omp:ro
    environment:
      - PI_CODING_AGENT_DIR=/home/pilot/.omp
      - GITHUB_TOKEN
    command: ["start", "--github", "--autopilot=dev"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  oh-my-pilot-data:
